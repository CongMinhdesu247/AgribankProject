# Isolated restore target. No web, no tunnel, no host ports, no production volume.
name: agribank-helpdesk-restore
services:
  db:
    image: mysql:8.4.7
    environment:
      MYSQL_DATABASE: agribank_helpdesk
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Use the project .env}
    command: [--innodb-buffer-pool-size=128M, --performance-schema=OFF]
    volumes:
      - restore_data:/var/lib/mysql
    networks: [restore]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysql -uroot -e "SELECT 1" >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
networks:
  restore:
    internal: true
volumes:
  restore_data:
