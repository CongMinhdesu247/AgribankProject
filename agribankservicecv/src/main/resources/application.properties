spring.application.name=agribankservicecv
server.port=8080
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Cấu hình kết nối MySQL Database
# Cấu hình kết nối MySQL Database trên Render
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agribank_helpdesk?useSSL=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cấu hình Hibernate/JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Cấu hình Telegram Bot Alert

telegram.bot.token=${TELEGRAM_BOT_TOKEN:}
telegram.bot.chat-id=${TELEGRAM_BOT_CHAT_ID:}


